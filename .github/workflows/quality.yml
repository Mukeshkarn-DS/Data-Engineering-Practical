name: Repository Quality

on:
  push:
    branches:
      - main
      - 'copilot/**'
      - 'chore/**'
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-syntax:
    name: Docs essentials and Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate essential repository files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            LICENSE
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            .gitignore
            .editorconfig
            docs/repository-guide.md
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file" >&2
              exit 1
            fi
          done

      - name: Validate practical README presence
        shell: bash
        run: |
          set -euo pipefail
          practical_dirs=(
            Practical-01
            Practical-3
            Pratical-02
            Pratical-04
            Pratical-05
            Pratical-06
            Pratical-07
            Praticall-08
            Pratical-09
            Pratical-10
          )

          for dir in "${practical_dirs[@]}"; do
            if [[ ! -d "$dir" ]]; then
              echo "Missing practical directory: $dir" >&2
              exit 1
            fi
            if [[ ! -f "$dir/README.md" ]]; then
              echo "Missing practical README: $dir/README.md" >&2
              exit 1
            fi
          done

      - name: Compile tracked Python files (syntax only)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' py_files < <(git ls-files '*.py' -z)
          if [[ ${#py_files[@]} -eq 0 ]]; then
            echo "No tracked Python files found."
            exit 0
          fi
          for file in "${py_files[@]}"; do
            python -m py_compile "$file"
          done

      - name: Note validation boundaries
        run: |
          echo "This workflow intentionally excludes runtime checks that need Airflow/Spark/MongoDB/Power BI or external APIs."
