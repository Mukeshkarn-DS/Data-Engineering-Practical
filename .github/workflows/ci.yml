name: CI

on:
  push:
    branches:
      - main
      - chore/professional-repo
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: python -m pip install --upgrade pip ruff pytest

      - name: Lint Python files
        run: ruff check . --output-format=concise

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests when present
        shell: bash
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' | grep -q .; then
            pytest -q
          else
            echo "No pytest test files found; skipping test execution."
          fi

      - name: Validate repository files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f CHANGELOG.md
